plugins {
    id 'com.android.application'
}

// Server address for the RAN MOBILE API. It is read at build time and is never hard-coded in source.
// Sources, first match wins:
//   1. gradle property      -PranServerUrl=https://host          (CI and command line)
//   2. file mobile/android/.env   line  RAN_SERVER_URL=https://host   (git-ignored; copy .env.example)
//   3. environment variable RAN_SERVER_URL
//   4. legacy property      -PranApiBaseUrl=...                  (kept for older commands)
//   debug:   gradle -p mobile/android assembleDebug -PranServerUrl=http://10.0.2.2:8080   (emulator -> host)
//   release: gradle -p mobile/android assembleRelease -PranServerUrl=https://host          (must be https)
def dotEnv = [:]
def dotEnvFile = file('../.env')
if (dotEnvFile.exists()) {
    dotEnvFile.eachLine { line ->
        def t = line.trim()
        if (t && !t.startsWith('#') && t.contains('=')) {
            def (k, v) = t.split('=', 2)
            dotEnv[k.trim()] = v.trim().replaceAll('^"|"$', '')
        }
    }
}
def serverUrlRaw = project.findProperty('ranServerUrl') ?: project.findProperty('ranApiBaseUrl')
        ?: dotEnv['RAN_SERVER_URL'] ?: System.getenv('RAN_SERVER_URL') ?: ''
def serverUrl = serverUrlRaw.toString().trim().replaceAll('/+$', '')

// Release signing. The keystore and its passwords are NEVER in Git.
// Sources, first match wins:
//   1. gradle properties   -PranKeystoreFile=... -PranKeystorePassword=... -PranKeyAlias=... -PranKeyPassword=...
//   2. keystore.properties in mobile/android/ (git-ignored; copy keystore.properties.example)
//   3. ~/.gradle/gradle.properties (the developer's own machine)
// scripts/make_test_keystore.sh generates a throw-away keystore for test builds.
def ksProps = [:]
def ksPropsFile = file('../keystore.properties')
if (ksPropsFile.exists()) {
    ksPropsFile.eachLine { line ->
        def t = line.trim()
        if (t && !t.startsWith('#') && t.contains('=')) {
            def (k, v) = t.split('=', 2)
            ksProps[k.trim()] = v.trim()
        }
    }
}
def ksProp = { String name, String gradleName ->
    project.findProperty(gradleName) ?: ksProps[name] ?: project.findProperty(name)
}
def ksFile = ksProp('ranKeystoreFile', 'ranKeystoreFile')
def hasSigning = ksFile != null && file(ksFile).exists()

android {
    namespace 'com.aiep7.app'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.aiep7.app'
        minSdk 26            // OpenGL ES 3.0 is available from API 18; 26 keeps the NDK floor modern
        targetSdk 34
        versionCode 2
        versionName '0.2.0'

        buildConfigField 'String', 'SERVER_URL', "\"${serverUrl}\""

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'   // phones + emulator
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(ksFile)
                storePassword ksProp('ranKeystorePassword', 'ranKeystorePassword')
                keyAlias ksProp('ranKeyAlias', 'ranKeyAlias')
                keyPassword ksProp('ranKeyPassword', 'ranKeyPassword')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // A readable APK name for installing by hand: RanAiEp7-<version>-<buildType>.apk
            applicationVariants.all { variant ->
                variant.outputs.each { output ->
                    def name = "RanAiEp7-${variant.versionName}-${variant.buildType.name}.apk"
                    output.outputFileName = name
                }
            }
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

// A release build must talk to the server over HTTPS only, and must know its server.
gradle.taskGraph.whenReady { graph ->
    boolean release = graph.allTasks.any { it.name.toLowerCase().contains('release') }
    if (release && !serverUrl.startsWith('https://')) {
        throw new GradleException('release builds need a https:// server URL (-PranServerUrl=https://... or RAN_SERVER_URL). Plain HTTP is debug-only.')
    }
}
