plugins {
    id 'com.android.application'
}

// Server address for the RAN MOBILE API, given at build time (never hard-coded in source).
//   debug:   gradle -p mobile/android assembleDebug -PranApiBaseUrl=http://10.0.2.2:8080   (emulator -> host)
//   release: gradle -p mobile/android assembleRelease -PranApiBaseUrl=https://<host>        (must be https)
def apiBaseUrl = (project.findProperty('ranApiBaseUrl') ?: '').toString().trim().replaceAll('/+$', '')

android {
    namespace 'com.aiep7.app'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'com.aiep7.app'
        minSdk 26            // OpenGL ES 3.0 is available from API 18; 26 keeps the NDK floor modern
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        buildConfigField 'String', 'API_BASE_URL', "\"${apiBaseUrl}\""

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'   // phones + emulator
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

// A release build must talk to the server over HTTPS only.
gradle.taskGraph.whenReady { graph ->
    boolean release = graph.allTasks.any { it.name.toLowerCase().contains('release') }
    if (release && !apiBaseUrl.startsWith('https://')) {
        throw new GradleException('release builds need -PranApiBaseUrl=https://... (plain HTTP is debug-only)')
    }
}
