name: ran-mobile-ci

on:
  push:
    branches: [main, 'arena/**']
    paths: ['ran_mobile/**', 'mobile/net_client/**', 'mobile/assets/**', '.github/workflows/ran-mobile-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ran_mobile/Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Start server and check health
        run: |
          python -m ranserver --db /tmp/ran_ci.db --host 127.0.0.1 --port 8080 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok": true'

  client-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/net_client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and run the C++ client against the live server
        # tee so a failing recipe is readable in the log (make -s prints the commands it runs), and
        # `$(MAKE)` shows the real exit status instead of make swallowing it.
        run: |
          set +e
          make -s test 2>&1 | tee /tmp/client-test.log
          rc=${PIPESTATUS[0]}
          echo "::group::tail of the client test log"
          tail -40 /tmp/client-test.log
          echo "::endgroup::"
          echo "make exited with $rc"
          exit $rc
      - name: Keep the client test log (diagnostics when the run fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-log
          path: /tmp/client-test.log
          if-no-files-found: warn
      - name: Reconnect and lifecycle test (session expiry -> resume, pause/resume, 401)
        # Short world idle timeout so the session really expires during the test.
        run: make -s test-reconnect IDLE_MS=2500
  assets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/assets
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder assets match their generator and manifest
        run: make -s test
