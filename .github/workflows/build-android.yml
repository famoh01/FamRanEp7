# Builds the AI EP7 debug APK on every push that touches the Android project,
# and uploads it as a downloadable artifact (install it on a phone directly).
name: build-android

on:
  push:
    paths:
      - 'mobile/android/**'
      - 'mobile/touch_hud/**'
      - 'mobile/net_client/**'
      - 'mobile/assets/**'
      - 'ran_mobile/Server/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages (platform, build-tools, CMake, NDK)
        # The ubuntu-latest runner ships the Android SDK at $ANDROID_SDK_ROOT.
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)"; fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Host tests for the reconnect state machine and the placeholder assets
        run: |
          make -C mobile/net_client test
          make -C mobile/assets test

      - name: Build debug APK (talks to the test server on the host through 10.0.2.2)
        shell: bash
        # pipefail: a failing gradle must fail the step even though tee succeeds.
        run: |
          set -o pipefail
          gradle -p mobile/android assembleDebug -PranServerUrl=http://10.0.2.2:8080 \
            --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gradle-debug.log"

      - name: Show the Gradle errors when the build fails
        if: failure()
        # Workflow annotations are readable from the API even when the log download fails, so the
        # compiler/CMake error is echoed as ::error lines (one per interesting line).
        run: |
          python3 - <<'PYERR'
          import os
          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "gradle-debug.log")
          lines = open(path, errors="replace").read().splitlines() if os.path.exists(path) else []
          keys = ("error:", "FAILURE", "What went wrong", "Caused by", "CMake Error", "ninja: ", "e: ",
                  "Execution failed", "ld:", "No such file", "undefined reference", "cannot find")
          picked = [l[:400] for l in lines if any(k in l for k in keys)]
          for l in picked[:20]:
              print("::error title=gradle::" + l.replace("%", "%25").replace("\r", ""))
          for l in lines[-25:]:
              print(l[:300])
          PYERR

      - name: Locate the built APK (and stage it for the emulator)
        run: |
          APK="$(find mobile/android/app/build -name '*.apk' | head -1)"
          echo "::notice title=apk-found::${APK:-none}"
          find mobile/android/app/build/outputs -type f | head -20
          test -n "$APK"
          # The emulator step runs in an environment where the workspace path is not exported, so the
          # APK is staged at a fixed path for adb install.
          cp "$APK" /tmp/ran-debug.apk
          ls -l /tmp/ran-debug.apk

      - name: Build the signed release APK (throw-away test keystore, never committed)
        run: |
          mobile/android/scripts/make_test_keystore.sh
          gradle -p mobile/android assembleRelease -PranServerUrl=https://example.invalid --no-daemon --stacktrace
          ls -l mobile/android/app/build/outputs/apk/release/
          # An installable release APK must be signed: check it with the build tools.
          APKSIGNER="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort | tail -1)"
          APK="$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/RanAiEp7-release.apk"
          echo "RELEASE_APK=$GITHUB_WORKSPACE/RanAiEp7-release.apk" >> "$GITHUB_ENV"

      - name: Start the RAN MOBILE server for the emulator (debug test server)
        working-directory: ran_mobile/Server
        run: |
          setsid nohup python3 -m ranserver --db /tmp/ci_smoke.db --host 0.0.0.0 --port 8080 > /tmp/ranserver.log 2>&1 < /dev/null &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok": true'

      - name: Enable KVM (needed for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probe the runner for emulator support
        run: |
          echo "::notice title=kvm::$(ls -l /dev/kvm 2>&1 | head -1)"
          echo "::notice title=cpu::$(grep -cE 'vmx|svm' /proc/cpuinfo 2>/dev/null || echo 0) virtualization flags"
          echo "::notice title=disk::$(df -h / | tail -1)"
          echo "::notice title=memory::$(free -g | head -2 | tail -1)"
          echo "::notice title=sdk::ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT emulator=$(command -v emulator || echo missing)"

      - name: Stage the device-test script outside .github
        # github.workspace exists in the action's script, but not in the job's plain steps, so the
        # results are written next to the staged APK in /tmp and copied into the workspace afterwards.
        run: |
          cp .github/scripts/android-device-tests.sh /tmp/device-tests.sh
          cp .github/scripts/android-taps.sh /tmp/android-taps.sh
          chmod +x /tmp/device-tests.sh /tmp/android-taps.sh

      - name: Run the on-device tests on an emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          # The APK was staged at a fixed path by the "Locate the built APK" step: the runner does not
          # export the workspace path into this script. Every stage is echoed as an annotation so a
          # failure is readable even when the job log cannot be downloaded.
          script: /tmp/device-tests.sh /tmp/ran-debug.apk /tmp

      - name: Collect the device-test results
        if: always()
        run: |
          for f in smoke-screen.png smoke-logcat.txt smoke-crash.txt ui-test-screen.png ui-test-logcat.txt \
                   reconnect-screen.png reconnect-logcat.txt reconnect-crash.txt combat-screen.png \
                   combat-logcat.txt combat-crash.txt device-setup.log; do
            [ -f "/tmp/$f" ] && cp "/tmp/$f" "$GITHUB_WORKSPACE/$f" || true
          done
          ls -l "$GITHUB_WORKSPACE"/*.png "$GITHUB_WORKSPACE"/*-logcat.txt 2>/dev/null | head -20 || true

      - name: Check the screen is drawn and the app did not crash
        run: |
          python3 -m pip install -q pillow
          python3 - <<'PYCHECK'
          import os, re, sys
          from PIL import Image
          ws = os.environ["GITHUB_WORKSPACE"]
          log = open(os.path.join(ws, "smoke-logcat.txt"), errors="replace").read()
          crashed = ("FATAL EXCEPTION" in log) or ("has stopped" in log)
          ready = "first frame drawn" in log
          joy = "joystick start" in log
          run_ok = "run on" in log
          bag_ok = "window open bag" in log
          labels_ok = "labels loaded" in log
          login_ok = "net login ok" in log
          char_ok = "character selected" in log
          mm = re.findall(r"player moved ([0-9.]+) px", log)
          moved = float(mm[-1]) if mm else 0.0
          im = Image.open(os.path.join(ws, "smoke-screen.png")).convert("RGB")
          im.thumbnail((360, 360))
          px = list(im.getdata())
          lit = sum(1 for r, g, b in px if max(r, g, b) > 60) / len(px)
          keep = [l for l in log.splitlines() if ("AiEp7" in l or "AndroidRuntime" in l or "FATAL" in l or "shader" in l or "EGL" in l or "has stopped" in l)]
          key = [l for l in log.splitlines() if "AiEp7" in l and re.search(r"touch |joystick|window|run |hud bag|potion|hit hp|respawn|resized|APP_CMD|net |character|login|ci ", l)]
          key_txt = " || ".join(re.sub(r"^.*AiEp7\s*:\s*", "", l)[:90] for l in key[-30:])
          summary = f"crashed={crashed} login={login_ok} character={char_ok} frame_drawn={ready} joystick_touch={joy} player_moved_px={moved:.0f} run_tap={run_ok} bag_tap={bag_ok} labels={labels_ok} lit_fraction={lit:.3f} size={im.size} | KEY: " + key_txt
          print(summary)
          print("::notice title=smoke-test::" + summary[:3000].replace("\n", " "))
          if crashed or not login_ok or not char_ok or not ready or not joy or moved < 20 or not run_ok or not bag_ok or not labels_ok or lit < 0.01:
              print("::error title=smoke-test failed::" + summary[:2500].replace("\n", " "))
              # Crash diagnostics (the artifact is not always reachable): signal + native backtrace.
              crash_path = os.path.join(ws, "smoke-crash.txt")
              crash = open(crash_path, errors="replace").read() if os.path.exists(crash_path) else ""
              lines = log.splitlines()
              ctx = [f"{i}: {l[:200]}" for i, l in enumerate(lines)
                     if ("FATAL" in l or "has stopped" in l or "Fatal signal" in l or "has died" in l
                         or "ANR in" in l or "Assets" in l or "assets:" in l)]
              print("::error title=crash-context::" + " | ".join(ctx[-25:])[:3000].replace("\n", " "))
              print(("::error title=crash-buffer::" + crash[-3000:].replace("\n", " || ")) if crash
                    else "::error title=crash-buffer::(empty)")
              print("---- last 60 log lines ----")
              for l in lines[-60:]:
                  print(l[:220])
              sys.exit(1)
          PYCHECK

      - name: Check the UI flow test (login, characters, enter world, logout)
        if: always()
        run: |
          python3 - <<'UICHECK'
          import os, re, sys
          ws = os.environ["GITHUB_WORKSPACE"]
          path = os.path.join(ws, "ui-test-logcat.txt")
          log = open(path, errors="replace").read() if os.path.exists(path) else ""
          expected = ["login_validation", "login_failed", "login_success", "character_empty", "create_character",
                      "character_list", "select_character", "logout", "login_success_again", "delete_open", "delete_confirm", "delete_done"]
          results = {m.group(1): (m.group(2), m.group(3)[:160])
                     for m in re.finditer(r"CI_TEST (\w+) (PASS|FAIL) ([^\n]*)", log)}
          summary = re.search(r"CI_TEST_SUMMARY pass=(\d+) fail=(\d+) total=(\d+)", log)
          crashed = ("FATAL EXCEPTION" in log) or ("has stopped" in log)
          lines = [f"{n}={results.get(n, ('MISSING', ''))[0]}" for n in expected]
          detail = " | ".join(f"{n}: {results.get(n, ('MISSING', ''))[1]}" for n in expected)
          msg = "ui-test " + " ".join(lines) + (" summary=" + summary.group(0) if summary else " summary=MISSING") \
                + f" crashed={crashed} | " + detail
          print(msg)
          print("::notice title=ui-flow-test::" + msg[:3000].replace("\n", " "))
          ok = (summary is not None and summary.group(2) == "0" and summary.group(3) == str(len(expected))
                and all(results.get(n, ("",))[0] == "PASS" for n in expected) and not crashed)
          if not ok:
              print("::error title=ui-flow-test failed::" + msg[:2500].replace("\n", " "))
              sys.exit(1)
          UICHECK

      - name: Check the reconnect and lifecycle test (session lost -> resumed, pause/resume)
        if: always()
        run: |
          python3 - <<'PYRECONNECT'
          import os, re, sys
          ws = os.environ["GITHUB_WORKSPACE"]
          path = os.path.join(ws, "reconnect-logcat.txt")
          log = open(path, errors="replace").read() if os.path.exists(path) else ""
          crashed = ("FATAL EXCEPTION" in log) or ("has stopped" in log)
          session_lost = "sync event session_lost" in log
          resumed = "sync event resumed" in log
          paused = "world sync paused" in log
          resumed_app = "world sync resumed" in log
          kept_position = len(re.findall(r"sync event resumed", log)) >= 1
          # The resume must put the character back at the exact position it had before the session
          # ended: the JNI logs both and the test compares them.
          before = re.findall(r"position before expiry (-?[0-9.]+),(-?[0-9.]+)", log)
          after = re.findall(r"sync event resumed[^\n]*pos=(-?[0-9.]+),(-?[0-9.]+)", log)
          same_position = bool(before and after) and (
              abs(float(before[0][0]) - float(after[-1][0])) < 1e-3 and
              abs(float(before[0][1]) - float(after[-1][1])) < 1e-3)
          key = [l for l in log.splitlines() if "sync event" in l or "world sync" in l or "device test" in l]
          before_txt = ",".join(before[0]) if before else "?"
          after_txt = ",".join(after[-1]) if after else "?"
          summary = (f"crashed={crashed} session_lost={session_lost} resumed={resumed} "
                     f"same_position={same_position} before={before_txt} after={after_txt} "
                     f"app_paused={paused} app_resumed={resumed_app} | " + " || ".join(
                         re.sub(r"^.*AiEp7\s*:\s*", "", l)[:110] for l in key[-12:]))
          print(summary)
          print("::notice title=reconnect-test::" + summary[:3000].replace("\n", " "))
          if (crashed or not session_lost or not resumed or not kept_position or not paused
                  or not resumed_app or not same_position):
              print("::error title=reconnect-test failed::" + summary[:2500].replace("\n", " "))
              crash_path = os.path.join(ws, "reconnect-crash.txt")
              crash = open(crash_path, errors="replace").read() if os.path.exists(crash_path) else ""
              print("::error title=reconnect-crash::" + (crash[-2500:].replace("\n", " || ") if crash else "(empty)"))
              print("---- last 60 log lines ----")
              for l in log.splitlines()[-60:]:
                  print(l[:220])
              sys.exit(1)
          PYRECONNECT

      - name: Check the combat test (target locked, the monster's HP dropped)
        if: always()
        run: |
          python3 - <<'PYCOMBAT'
          import os, re, sys
          ws = os.environ["GITHUB_WORKSPACE"]
          path = os.path.join(ws, "combat-logcat.txt")
          log = open(path, errors="replace").read() if os.path.exists(path) else ""
          crashed = ("FATAL EXCEPTION" in log) or ("has stopped" in log)
          targets = re.findall(r"ci combat target=(\d+)", log)
          target = int(targets[-1]) if targets else 0
          # Every status line is {"event": .., "hits": N, "kills": N, "target_hp": M, "target_max_hp": K}
          statuses = [dict(re.findall(r'"(\w+)":\s*(?:"([^"]*)"|(-?\d+))', m))
                      for m in re.findall(r"ci combat status (\{[^}]*\})", log)]
          def num(st, key):
              try:
                  return int(st.get(key, "0") or 0)
              except ValueError:
                  return 0
          hits = max([num(s, "hits") for s in statuses] or [0])
          hp_seen = [num(s, "target_hp") for s in statuses if num(s, "target_max_hp") > 0]
          events = [s.get("event", "") for s in statuses]
          hit_events = [e for e in events if e in ("hit", "miss", "cooldown")]
          hp_dropped = bool(hp_seen) and max(hp_seen) < (statuses[-1].get("target_max_hp") and num(statuses[-1], "target_max_hp") or 10 ** 9)
          damage_seen = "combat event hit" in log or "combat event killed" in log
          summary = (f"crashed={crashed} target={target} hits={hits} hp_seen={hp_seen[-6:]} "
                     f"hp_dropped={hp_dropped} damage={damage_seen} events={events[-6:]}")
          print(summary)
          print("::notice title=combat-test::" + summary[:3000])
          if crashed or target == 0 or hits < 1 or not damage_seen:
              print("::error title=combat-test failed::" + summary[:2500])
              print("---- last 60 log lines ----")
              for l in log.splitlines()[-60:]:
                  print(l[:220])
              sys.exit(1)
          PYCOMBAT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-evidence
          path: |
            smoke-screen.png
            smoke-logcat.txt
            ui-test-screen.png
            ui-test-logcat.txt
            reconnect-screen.png
            reconnect-logcat.txt
            combat-screen.png
            combat-logcat.txt
            smoke-crash.txt
            reconnect-crash.txt
            combat-crash.txt
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ai-ep7-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ran-mobile-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
